const ALIASES = { 'zh': 'zh-CN', 'zh-TW': 'zh-CN', 'zh-Hans': 'zh-CN', 'es-ES': 'es', 'de-DE': 'de', 'fr-FR': 'fr', 'ja-JP': 'ja' };

function detectLang() {
  const raw = navigator.language || 'en';
  const mapped = ALIASES[raw] || raw;
  if (I18N[mapped]) return mapped;
  const base = raw.split('-')[0].toLowerCase();
  return I18N[base] ? base : 'en';
}

function apply(t) {
  document.title = t.title.replace(/🔗\s*/, '') + ' - LinkHarvest';
  document.getElementById('title').textContent = t.title;
  document.getElementById('updated').textContent = t.updated;
  document.getElementById('highlight').innerHTML = t.highlight;
  ['h1','p1','h2','p2','p2note','h3','p3','h4','p4','h5','p5','footer'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = t[id];
  });
  if (t.l1) document.getElementById('l1').innerHTML = t.l1.map(i => '<li>'+i+'</li>').join('');
  if (t.l2) document.getElementById('l2').innerHTML = t.l2.map(i => '<li>'+i+'</li>').join('');
  document.documentElement.lang = detectLang();
}

apply(I18N[detectLang()]);
</script>
</body>
</html>
