    h4: 'データ保存', p4: 'スキャン結果は <code>chrome.storage.local</code> に一時保存され、スキャンされたタブが閉じると自動削除されます。アンインストール時に全データが削除されます。',
    h5: 'お問い合わせ', p5: 'ご質問は <a href="https://github.com/annmax1983/LinkHarvest">GitHub</a> で Issue を作成してください。',
    footer: '© 2026 LinkHarvest. All rights reserved.'

  de: {

    updated: 'Letzte Aktualisierung: August 2026',
    highlight: '<strong>Kurzfassung:</strong> Alle kostenlosen Funktionen arbeiten vollständig offline — keine Netzwerkanfragen. Die einzige Netzwerkkommunikation ist die optionale Premium-Lizenzaktivierung. Ohne Lizenz verbindet sich die Erweiterung nie mit dem Internet.',
    h1: 'Datenerfassung', p1: 'LinkHarvest erfasst <strong>keine</strong> personenbezogenen Daten:', l1: ['Browserverlauf oder besuchte URLs', 'Seiteninhalte, Bilder oder Text', 'Cookies oder Tracking-Kennungen', 'Nutzungsanalysen oder Telemetrie'],
    h2: 'Berechtigungen', p2: 'LinkHarvest beantragt nur minimale Berechtigungen:', l2: ['<strong>activeTab</strong> — Zugriff nur beim Klick auf das Erweiterungssymbol', '<strong>scripting</strong> — Link-Sammelskript wird nur bei benutzergesteuertem Scan injiziert', '<strong>storage</strong> — Speichert Scan-Ergebnisse temporär; wird beim Schließen des gescannten Tabs gelöscht'], p2note: 'Lizenzverifizierung verbindet sich nur bei Aktivierung einer kostenpflichtigen Lizenz mit <code>api.annmax1983.com</code>. Kostenlose Funktionen haben keine Netzwerkanfragen.',
    h3: 'Drittanbieterdienste', p3: '<strong>Lizenzverifizierung (Premium):</strong> Bei aktivierter Premium-Lizenz verbindet sich LinkHarvest über <a href="https://creem.io" target="_blank" rel="noopener">Creem</a> mit dem Lizenzserver. Ohne Lizenz keine Netzwerkanfragen.',
    h4: 'Datenspeicherung', p4: 'Scan-Ergebnisse werden temporär in <code>chrome.storage.local</code> gespeichert und beim Schließen des gescannten Tabs gelöscht. Bei Deinstallation werden alle Daten gelöscht.',
    h5: 'Kontakt', p5: 'Bei Fragen erstellen Sie bitte ein Issue auf <a href="https://github.com/annmax1983/LinkHarvest">GitHub</a>.',
    footer: '© 2026 LinkHarvest. Alle Rechte vorbehalten.'
  },
  es: {
    title: '🔗 LinkHarvest — Política de Privacidad',
    updated: 'Última actualización: agosto de 2026',
    highlight: '<strong>Resumen:</strong> Todas las funciones gratuitas funcionan completamente offline — cero solicitudes de red. La única comunicación de red es la activación opcional de licencia Premium. Sin licencia, la extensión nunca se conecta a internet.',
    h1: 'Recopilación de Datos', p1: 'LinkHarvest <strong>no</strong> recopila ningún dato personal:', l1: ['Historial de navegación o URLs visitadas', 'Contenido de página, imágenes o texto', 'Cookies o identificadores de seguimiento', 'Analíticas de uso o telemetría'],
    h2: 'Permisos', p2: 'LinkHarvest solicita permisos mínimos:', l2: ['<strong>activeTab</strong> — Acceso solo al hacer clic en el icono de la extensión', '<strong>scripting</strong> — Inyecta el script de recopilación de enlaces solo en escaneos iniciados por el usuario', '<strong>storage</strong> — Almacena resultados temporalmente; se eliminan al cerrar la pestaña escaneada'], p2note: 'La verificación de licencia solo se conecta a <code>api.annmax1983.com</code> al activar una licencia de pago. Las funciones gratuitas no hacen solicitudes de red.',
    h3: 'Servicios de Terceros', p3: '<strong>Verificación de licencia (Premium):</strong> Si activa una licencia premium, LinkHarvest se conecta al servidor de licencias vía <a href="https://creem.io" target="_blank" rel="noopener">Creem</a>. Sin licencia, no se realizan solicitudes de red.',

const ALIASES = { 'zh': 'zh-CN', 'zh-TW': 'zh-CN', 'zh-Hans': 'zh-CN', 'es-ES': 'es', 'de-DE': 'de', 'fr-FR': 'fr', 'ja-JP': 'ja' };

function detectLang() {
  const raw = navigator.language || 'en';
  const mapped = ALIASES[raw] || raw;
  if (I18N[mapped]) return mapped;
  const base = raw.split('-')[0].toLowerCase();
  return I18N[base] ? base : 'en';
}

function apply(t) {
  document.title = t.title.replace(/🔗\s*/, '') + ' - LinkHarvest';
  document.getElementById('title').textContent = t.title;
  document.getElementById('updated').textContent = t.updated;
  document.getElementById('highlight').innerHTML = t.highlight;
  ['h1','p1','h2','p2','p2note','h3','p3','h4','p4','h5','p5','footer'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = t[id];
  });
  if (t.l1) document.getElementById('l1').innerHTML = t.l1.map(i => '<li>'+i+'</li>').join('');
  if (t.l2) document.getElementById('l2').innerHTML = t.l2.map(i => '<li>'+i+'</li>').join('');
  document.documentElement.lang = detectLang();
}

apply(I18N[detectLang()]);
</script>
</body>
</html>
