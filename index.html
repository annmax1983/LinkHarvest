<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkHarvest - 一键提取页面链接</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      max-width: 820px;
      width: 100%;
      overflow: hidden;
    }

    /* ── Header banner ── */
    .banner {
      background: linear-gradient(135deg, #2E7D32 0%, #66BB6A 100%);
      padding: 36px 40px 32px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .banner-icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      backdrop-filter: blur(4px);
    }
    .banner-text h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .banner-text p {
      font-size: 14px;
      opacity: 0.85;
      line-height: 1.5;
    }

    /* ── Body two-column ── */
    .body {
      display: flex;
      gap: 0;
    }

    .col {
      flex: 1;
      padding: 32px 36px;
    }
    .col-left {
      border-right: 1px solid #eee;
    }

    .col h2 {
      font-size: 15px;
      font-weight: 600;
      color: #2E7D32;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feature-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .feature-list li {
      font-size: 14px;
      line-height: 1.6;
      color: #444;
      padding-left: 22px;
      position: relative;
    }
    .feature-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2E7D32;
      opacity: 0.5;
    }

    .thank-text {
      font-size: 14px;
      line-height: 1.8;
      color: #555;
    }
    .thank-text p + p {
      margin-top: 12px;
    }
    .thank-text .heart {
      color: #e74c3c;
    }

    /* ── CTA ── */
    .cta {
      text-align: center;
      padding: 28px 36px 36px;
      border-top: 1px solid #eee;
    }
    .cta p {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }
    .kofi-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 28px;
      background: #FF5E5B;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .kofi-btn:hover {
      background: #E04E4B;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 94, 91, 0.35);
    }
    .disclaimer {
      font-size: 11px;
      color: #999;
      margin-top: 10px;
      line-height: 1.5;
    }


    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 16px 36px 20px;
      font-size: 12px;
      color: #aaa;
    }
    .footer a {
      color: #2E7D32;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      body { padding: 12px; }
      .banner { padding: 24px 20px; flex-direction: column; text-align: center; }
      .body { flex-direction: column; }
      .col-left { border-right: none; border-bottom: 1px solid #eee; }
      .col { padding: 24px 20px; }
      .cta { padding: 24px 20px 28px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Banner -->
    <div class="banner">
      <div class="banner-icon">🔗</div>
      <div class="banner-text">
        <h1>LinkHarvest</h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>

    <!-- Body: two columns -->
    <div class="body">
      <!-- Left: features -->
      <div class="col col-left">
        <h2 data-i18n="featuresTitle"></h2>
        <ul class="feature-list" id="featureList"></ul>
      </div>

      <!-- Right: thank you -->
      <div class="col">
        <h2 data-i18n="thankTitle"></h2>
        <div class="thank-text" id="thankText"></div>
      </div>
    </div>

    <!-- CTA -->
    <div class="cta">
      <p data-i18n="ctaHint"></p>
      <a class="kofi-btn" href="https://ko-fi.com/annmax?ref=linkharvest" target="_blank" rel="noopener">
        <img src="./assets/coffee.png" alt="" width="24" height="18" style="vertical-align:middle"> <span data-i18n="btnText"></span>
      </a>
      <p class="disclaimer" data-i18n="disclaimer"></p>

      &nbsp;·&nbsp; Copyright © 2026 LinkHarvest

  </div>

        featuresTitle: '✨ 機能紹介',

    // ============================================================
    //  Language detection
    // ============================================================
    function detectLang() {
      const code = (navigator.language || 'en').split('-')[0].toLowerCase();
      return I18N[code] ? code : 'en';
    }

    // ============================================================
    //  Apply translations to DOM
    // ============================================================
    function applyLang(lang) {
      const t = I18N[lang];

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) {
          if (key === 'thank') return;
          el.textContent = t[key];
        }
      });

      // Feature list
      const list = document.getElementById('featureList');
      list.innerHTML = t.features.map(f => `<li>${f}</li>`).join('');

      // Thank you paragraphs
      const thankDiv = document.getElementById('thankText');
      thankDiv.innerHTML = t.thank.map(p => `<p>${p}</p>`).join('');

      document.documentElement.lang = lang;
    }

    // ============================================================
    //  Init
    // ============================================================
    const lang = detectLang();
    applyLang(lang);
  </script>

</html>
